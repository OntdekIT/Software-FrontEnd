server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security headers. NB: nginx does not merge add_header across levels, so a
    # location block that sets its own add_header (see .mjs below) must repeat
    # any headers it still needs. These cover the SPA responses.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # The stock nginx mime.types only maps `js`, so ES module workers
    # (maplibre-gl-worker.mjs) are served as application/octet-stream and
    # rejected by the browser's strict MIME check. Force .mjs to JavaScript.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Content-Type text/javascript;
    }

    # SPA fallback: client-side routes (React Router) must return index.html
    # instead of 404 on direct load / refresh of a deep link like /stations.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
