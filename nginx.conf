server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security headers. NB: nginx does not merge add_header across levels, so a
    # location block that sets its own add_header (see .mjs below) must repeat
    # any headers it still needs. These cover the SPA responses.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Compress text assets. gzip_vary so caches keep a plain and a gzipped copy
    # apart. Images and fonts (png, jpg, woff2) are already compressed: skip.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        application/xml;

    # The stock nginx mime.types only maps `js`, so ES module workers
    # (maplibre-gl-worker.mjs) are served as application/octet-stream and
    # rejected by the browser's strict MIME check. Force .mjs to JavaScript.
    # Own add_header here, so the security headers are repeated.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Content-Type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }

    # Vite puts a content hash in every file name under /assets/, so these never
    # change under the same URL: cache for a year. A missing file must 404 and not
    # fall back to index.html (that would cache HTML under a .js URL).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }

    # The HTML entry points at the current hashed files, so it must be
    # revalidated on every load (cheap: 304 via ETag) or users get stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }

    # SPA fallback: client-side routes (React Router) must return index.html
    # instead of 404 on direct load / refresh of a deep link like /stations.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }
}
