name: Security checks

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout repository (volledige historie)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (met checksum-controle)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/ gitleaks_.*/  gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan volledige git-historie op secrets
        # Leest .gitleaks.toml en .gitleaksignore uit de repo. De uitvoer wordt
        # geredigeerd zodat een gevonden secret niet in de CI-log belandt.
        run: ./gitleaks git --redact --verbose --no-banner --exit-code 1 .

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      # Productie-afhankelijkheden blokkeren de pipeline bij high of critical.
      - name: npm audit (productie, faalt bij high)
        run: npm audit --omit=dev --audit-level=high

      # Dev-tools (vite, cypress) komen niet in de gebouwde app terecht. Wel
      # zichtbaar houden, maar niet blokkerend.
      - name: npm audit (dev-afhankelijkheden, informatief)
        run: npm audit --audit-level=high
        continue-on-error: true
