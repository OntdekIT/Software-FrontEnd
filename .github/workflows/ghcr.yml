name: Frontend CI to GitHub Container Registry

on:
  push:
    branches: [ "main", "develop", "s3nj26", "s3nj26_dev" ]
  pull_request:
    branches: [ "main", "develop", "s3nj26", "s3nj26_dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Test Docker image
        run: |
          docker build -t climatechecker-frontend .
          docker run -d --name test-frontend -p 3000:5173 climatechecker-frontend
          sleep 10
          SUCCESS=false
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            sleep 3
          done
          if [ "$SUCCESS" = "false" ]; then
            docker logs test-frontend
            docker rm -f test-frontend
            exit 1
          fi
          docker rm -f test-frontend

      # Everything below only runs on push to a branch, never on pull_request:
      # PRs should build/lint/test but must not create release tags or publish
      # images (that also avoids two concurrent runs racing for the same tag).
      - name: Compute next semantic version
        id: next
        if: github.event_name == 'push'
        run: |
          # Consider only semver release tags (e.g. 1.0.5); milestone tags such
          # as "s3vj26-final" are ignored so they never reach version parsing.
          # Retry a few times so concurrent pushes don't collide on the same tag.
          git fetch --tags --force origin
          for attempt in 1 2 3 4 5; do
            latest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
            [ -z "$latest" ] && latest="0.0.0"
            IFS='.' read -r major minor patch <<< "$latest"
            next="${major}.${minor}.$((patch + 1))"
            if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
              echo "Tag ${next} already exists locally, retrying..."
              git fetch --tags --force origin; continue
            fi
            echo "Latest semver tag: ${latest} -> next: ${next}"
            echo "patch=${next}" >> "$GITHUB_OUTPUT"
            break
          done

      - name: Set lowercase owner
        id: owner
        if: github.event_name == 'push'
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push new Git tag
        if: github.event_name == 'push'
        run: |
          git config user.name "${{ github.actor }}"
          TAG="${{ steps.next.outputs.patch }}"
          # If a concurrent run already published this tag, skip rather than fail.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping tag push."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag climatechecker-frontend ghcr.io/${{ steps.owner.outputs.owner }}/climatechecker-frontend:${{ steps.next.outputs.patch }}
          docker tag climatechecker-frontend ghcr.io/${{ steps.owner.outputs.owner }}/climatechecker-frontend:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/climatechecker-frontend:${{ steps.next.outputs.patch }}
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/climatechecker-frontend:latest

